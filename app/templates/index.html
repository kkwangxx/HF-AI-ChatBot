<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{{ app_title }}</title>
  <link rel="stylesheet" href="/static/css/chat.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github-dark.min.css">
</head>
<body>
  <svg class="sr-only" aria-hidden="true">
    <symbol id="i-chat" viewBox="0 0 24 24">
      <path d="M21 15a4 4 0 0 1-4 4H8l-5 3V7a4 4 0 0 1 4-4h10a4 4 0 0 1 4 4z"/>
      <path d="M8 9h8M8 13h5"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="i-menu" viewBox="0 0 24 24">
      <path d="M4 6h16M4 12h16M4 18h16"/>
    </symbol>
    <symbol id="i-send" viewBox="0 0 24 24">
      <path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </symbol>
    <symbol id="i-clip" viewBox="0 0 24 24">
      <path d="m21 11-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 1 1-2.8-2.8L15 5.8"/>
    </symbol>
  </svg>

  <div class="backdrop" id="backdrop"></div>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="side-head">
        <div class="brand">
          <span class="logo"><svg class="icon"><use href="#i-chat"/></svg></span>
          <span>{{ app_title }}</span>
        </div>
        <span class="spacer"></span>
        <button class="ibtn mobile-close" data-close="sidebar" aria-label="关闭侧边栏">×</button>
      </div>
      <button class="new-chat" id="newChat">＋ 新建聊天</button>
      <div class="chat-list" id="chatList"></div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="ibtn" id="openSidebar" aria-label="折叠侧边栏" title="折叠侧边栏">
          <svg class="icon"><use href="#i-menu"/></svg>
        </button>
        <div class="model-pill">
          <span class="provider-dot"></span>
          <div class="model-select-wrap">
            <small>模型</small>
            <select id="modelSelect" aria-label="选择模型" title="切换模型"></select>
          </div>
        </div>
        <span class="spacer"></span>
        <button class="ibtn" id="themeBtn" title="切换主题" aria-label="切换主题">
          <svg class="icon"><use href="#i-sun"/></svg>
        </button>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <div class="composer-wrap">
        <div class="attachments" id="attachments"></div>
        <div class="composer">
          <textarea id="prompt" rows="1" placeholder="输入消息，可附带图片 / PDF / 文本文件..." aria-label="消息"></textarea>
          <div class="compose-actions">
            <input
              id="fileInput"
              type="file"
              multiple
              hidden
              accept="image/jpeg,image/png,image/gif,image/webp,application/pdf,.txt,.md,.json,.csv,.py,.js,.ts,.java,.sql,.xml,.yaml,.yml,.log"
            >
            <button class="ibtn" id="attachBtn" type="button" title="上传文件" aria-label="上传文件">
              <svg class="icon"><use href="#i-clip"/></svg>
            </button>
            <span class="hint">Enter 发送 · Shift+Enter 换行 · 支持图片/PDF/文本</span>
            <span class="spacer"></span>
            <button class="send" id="sendBtn" aria-label="发送" title="发送">
              <svg class="icon"><use href="#i-send"/></svg>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/highlight.min.js"></script>
  <script src="/static/js/chatStorage.js"></script>
  <script src="/static/js/sseClient.js"></script>
  <script src="/static/js/markdown.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
